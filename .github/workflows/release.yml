name: Release

on:
  push:
    tags:
      - 'v*'
  # Retry a release that crashed after the tag was already pushed, without
  # deleting and re-cutting the tag: `gh workflow run release.yml --ref vX.Y.Z`.
  # Every publish step in the reusable is idempotent, and it derives the version
  # from the ref name — so a tag ref resumes the release and a branch ref fails
  # loudly at version resolution instead of publishing anything.
  workflow_dispatch:

permissions: {}

jobs:
  release:
    uses: netresearch/typo3-ci-workflows/.github/workflows/release-typo3-extension.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      archive-prefix: 'nr-temporal-cache'
      package-name: 'netresearch/nr-temporal-cache'
      extension-key: 'nr_temporal_cache'
    secrets:
      TYPO3_TER_ACCESS_TOKEN: ${{ secrets.TYPO3_TER_ACCESS_TOKEN }}
