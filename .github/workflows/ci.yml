name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Per-extension test matrix (intentional-drift). Security/quality jobs are in checks.yml.
jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      # 8.2 leads the list because php-versions[0] is the version the
      # single-run jobs use (Code Style, Fractor) and the fallback for Rector,
      # and netresearch/typo3-ci-workflows requires php ^8.2. 8.1 stays in the
      # matrix, so the ^12.4 cells still cover it.
      php-versions: '["8.2","8.1","8.3","8.4","8.5"]'
      typo3-versions: '["^12.4","^13.0","^14.0"]'
      matrix-exclude: '[{"php":"8.1","typo3":"^13.0"},{"php":"8.1","typo3":"^14.0"},{"php":"8.2","typo3":"^14.0"},{"php":"8.5","typo3":"^12.4"}]'
      run-functional-tests: true
      # Both default to false, and while they are off the reusable runs the
      # suites with --no-coverage and skips the Codecov upload entirely — so
      # nothing evaluates the 69% threshold that README.md and AGENTS.md
      # document. Turning them on produces the clover reports Codecov measures
      # the target in `codecov.yml` against, plus JUnit reports for Test
      # Analytics. CODECOV_TOKEN is passed under `secrets:` below.
      upload-coverage: true
      upload-test-results: true
      # The Rector job is not matrixed and falls back to php-versions[0], which
      # is 8.2 above. Pinned anyway so reordering that list cannot silently drop
      # Rector below the php ^8.2 netresearch/typo3-ci-workflows requires.
      rector-php-version: '8.2'
      # That same package is unresolvable under typo3/cms-core ^12.4
      # (saschaegerer/phpstan-typo3 ^2||^3 needs cms-core >=13.4), so drop it
      # from the ^12.4 matrix cells. The Rector job keeps it.
      remove-dev-deps: '[{"dep":"netresearch/typo3-ci-workflows","only-for":"^13.0|^14.0"}]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
